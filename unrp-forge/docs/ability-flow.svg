<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title description">
  <title id="title">How a move reaches the world</title>
  <desc id="description">The client requests a move. The server decides whether it runs. Load definitions: UnodexLoader reads the ability JSON. UnodexData holds definitions and aliases. Send input: AbilityBar reads the configured key. UseAbilityPacket carries the input to the server. Check the request: AbilityEngine resolves the current power. State, aura, cooldowns and unlocks are checked. Run the move: Generic effects run in AbilityEngine. Specials and event handlers cover custom behavior. Apply gameplay: The server changes damage, inventory or state. Effective level includes partial recovery. Show the result: State and effect packets reach the clients. Screens, layers and particles render the result.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#ad8845"/></marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #e6e8eb; }
    .heading { font-size: 28px; font-weight: 650; }
    .label { font-size: 19px; font-weight: 600; }
    .body { font-size: 16px; fill: #bec5ce; }
    .number { font-size: 16px; fill: #e4be74; }
    .link { fill: none; stroke: #ad8845; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1120" height="820" rx="12" fill="#171c23"/>
  <text x="40" y="54" class="heading">How a move reaches the world</text>
  <text x="40" y="87" class="body">The client requests a move. The server decides whether it runs.</text>
