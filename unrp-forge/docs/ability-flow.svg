  <text x="600" y="149" class="number">02</text>
  <text x="638" y="149" class="label">Send input</text>
  <text x="600" y="181" class="body">AbilityBar reads the configured key.</text>
  <text x="600" y="205" class="body">UseAbilityPacket carries the input to the server.</text>
  <path d="M830 252 V267 H290 V276" class="link"/>
  <rect x="40" y="282" width="500" height="132" rx="6" fill="#222a35" stroke="#46505e"/>
  <text x="60" y="311" class="number">03</text>
  <text x="98" y="311" class="label">Check the request</text>
  <text x="60" y="343" class="body">AbilityEngine resolves the current power.</text>
  <text x="60" y="367" class="body">State, aura, cooldowns and unlocks are checked.</text>
  <path d="M540 348 H574" class="link"/>
  <rect x="580" y="282" width="500" height="132" rx="6" fill="#222a35" stroke="#46505e"/>
  <text x="600" y="311" class="number">04</text>
  <text x="638" y="311" class="label">Run the move</text>
  <text x="600" y="343" class="body">Generic effects run in AbilityEngine.</text>
  <text x="600" y="367" class="body">Specials and event handlers cover custom behavior.</text>
  <path d="M830 414 V429 H290 V438" class="link"/>
  <rect x="40" y="444" width="500" height="132" rx="6" fill="#222a35" stroke="#46505e"/>
  <text x="60" y="473" class="number">05</text>
  <text x="98" y="473" class="label">Apply gameplay</text>
  <text x="60" y="505" class="body">The server changes damage, inventory or state.</text>
  <text x="60" y="529" class="body">Effective level includes partial recovery.</text>
  <path d="M540 510 H574" class="link"/>
  <rect x="580" y="444" width="500" height="132" rx="6" fill="#222a35" stroke="#46505e"/>
  <text x="600" y="473" class="number">06</text>
  <text x="638" y="473" class="label">Show the result</text>
  <text x="600" y="505" class="body">State and effect packets reach the clients.</text>
  <text x="600" y="529" class="body">Screens, layers and particles render the result.</text>
  <path d="M40 632 H1080" stroke="#46505e"/>
  <text x="40" y="667" class="body">Keep costs and cooldowns in JSON; add Java when the move needs new behavior.</text>
  <text x="40" y="695" class="body">Client screens collect input. Server handlers enforce ownership and permissions.</text>
  <text x="40" y="723" class="body">Code map: ARCHITECTURE.md · Adding a move: ABILITY_DEVELOPMENT.md</text>
